name: sense_frontend daily changelog

on:
  schedule:
    # 07:00 UTC = midnight PDT (Mar-Nov) / 11pm PST previous day (Nov-Mar).
    # GitHub Actions cron does not honor DST; the 1-hour drift is accepted.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: 'How many hours back to include'
        required: false
        default: '24'
      digest_date:
        description: 'Override digest date label (YYYY-MM-DD)'
        required: false

permissions:
  contents: write  # need to create/delete the agent's scratch branch
  issues: write

concurrency:
  group: sense-frontend-digest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate digest
        id: gen
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          OWN_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENSE_FRONTEND_GITHUB_TOKEN: ${{ secrets.SENSE_FRONTEND_GITHUB_TOKEN }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '24' }}
          DIGEST_DATE: ${{ github.event.inputs.digest_date }}
        # Cursor agents can take several minutes; give the job headroom.
        timeout-minutes: 20
        run: node .github/scripts/sense-frontend-digest.js

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sense-frontend-digest-${{ steps.gen.outputs.digest_date || github.run_id }}
          path: _digests/
          retention-days: 30

      - name: Ensure changelog-digest label exists
        if: steps.gen.outputs.skip_email != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create changelog-digest \
            --repo "${{ github.repository }}" \
            --color F9345F \
            --description "Auto-posted sense_frontend daily digest" \
            2>/dev/null || true

      - name: Post digest as GitHub Issue (internal archive)
        id: issue
        if: steps.gen.outputs.skip_email != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Kept as a searchable, timestamped record of every draft AND the
        # canonical fetch source for Galadriel if it wants full content
        # (Slack messages have length limits; the issue does not).
        run: |
          URL=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "Air digest — ${{ steps.gen.outputs.digest_date }} (${{ steps.gen.outputs.pr_count }} PRs considered)" \
            --label changelog-digest \
            --body-file "${{ steps.gen.outputs.md_path }}")
          echo "issue_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Hand off to Galadriel via Slack
        if: steps.gen.outputs.skip_email != 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MD_PATH: ${{ steps.gen.outputs.md_path }}
          HTML_PATH: ${{ steps.gen.outputs.html_path }}
          DIGEST_DATE: ${{ steps.gen.outputs.digest_date }}
          PR_COUNT: ${{ steps.gen.outputs.pr_count }}
          ISSUE_URL: ${{ steps.issue.outputs.issue_url }}
        # Posts to Slack in a shape Galadriel can parse. The message text is
        # a human-readable header + a fenced JSON payload with everything
        # needed to render + fan out. The GH issue URL is included as the
        # canonical fetch source in case body content ever hits Slack's
        # length limits (issues have no such limit).
        run: |
          node -e '
            const fs = require("node:fs");
            const md = fs.readFileSync(process.env.MD_PATH, "utf8");
            const html = fs.readFileSync(process.env.HTML_PATH, "utf8");
            const humanDate = new Date(process.env.DIGEST_DATE).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
            const payload = {
              source: "sense_frontend_daily_digest",
              digest_date: process.env.DIGEST_DATE,
              subject: `Air — What shipped ${humanDate}`,
              body_markdown: md,
              body_html: html,
              archive_url: process.env.ISSUE_URL,
              meta: {
                pr_count: Number(process.env.PR_COUNT),
                base_branch: "develop",
                lookback_hours: 24,
              }
            };
            const header = `:newspaper: *Air daily digest — ${humanDate}*\n${process.env.PR_COUNT} PRs considered · full archive: ${process.env.ISSUE_URL}\n_Galadriel: please parse the JSON below and distribute to the Air customer list._`;
            const body = { text: header + "\n```json\n" + JSON.stringify(payload, null, 2) + "\n```" };
            fetch(process.env.SLACK_WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            }).then(async (r) => {
              if (!r.ok) { console.error(await r.text()); process.exit(1); }
              console.log("Posted to Slack for Galadriel.");
            }).catch((e) => { console.error(e); process.exit(1); });
          '
